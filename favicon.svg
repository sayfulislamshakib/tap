<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Background Dark Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1c1e" />
      <stop offset="100%" stop-color="#09090b" />
    </linearGradient>

    <!-- Tap Button Vibrant Blue Gradient -->
    <linearGradient id="btnGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#389bfe" />
      <stop offset="100%" stop-color="#0066eb" />
    </linearGradient>

    <!-- Subtle Glow Shadow -->
    <filter id="btnShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0066eb" flood-opacity="0.45" />
    </filter>

    <radialGradient id="ringGlow" cx="50%" cy="50%" r="50%">
      <stop offset="70%" stop-color="#389bfe" stop-opacity="0" />
      <stop offset="100%" stop-color="#389bfe" stop-opacity="0.4" />
    </radialGradient>
  </defs>

  <!-- iOS App Icon Squircle Background -->
  <rect width="512" height="512" rx="114" fill="url(#bgGrad)" />

  <!-- Subtle Inner Border Highlight -->
  <rect x="2" y="2" width="508" height="508" rx="112" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="4" />

  <!-- Concentric Ripple Wave -->
  <circle cx="256" cy="275" r="160" fill="none" stroke="rgba(56, 155, 254, 0.22)" stroke-width="4" />
  <circle cx="256" cy="275" r="195" fill="none" stroke="rgba(56, 155, 254, 0.12)" stroke-width="2.5" />

  <!-- Tap Counter Button Base with Shadow -->
  <circle cx="256" cy="275" r="125" fill="url(#btnGrad)" filter="url(#btnShadow)" />

  <!-- Outer Ring Accent -->
  <circle cx="256" cy="275" r="125" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="3" />

  <!-- Counter Digits / Tally Icon Graphic on the Button -->
  <!-- Hand Tap / Index Finger Touch Graphic -->
  <g fill="#ffffff">
    <!-- Touch Ripple Center Dot -->
    <circle cx="256" cy="215" r="12" fill="#ffffff" />
    <circle cx="256" cy="215" r="26" fill="none" stroke="#ffffff" stroke-width="3" opacity="0.75" />
    <circle cx="256" cy="215" r="42" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.45" stroke-dasharray="6 4" />

    <!-- Minimalist stylized tap counter badge number 1 / tally -->
    <path d="M246 250 H266 V325 H246 Z" />
    <path d="M232 268 L256 250 L256 268 Z" />
    <rect x="230" y="325" width="52" height="10" rx="5" />
  </g>

  <!-- Top Counter Display Dots (iOS inspired) -->
  <circle cx="216" cy="95" r="6" fill="#30d158" />
  <circle cx="256" cy="95" r="6" fill="#157dfb" />
  <circle cx="296" cy="95" r="6" fill="#ffd60a" />
</svg>
